name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
      - name: Get Pico SDK
        run: git clone --depth 1 --branch 2.1.1 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk "$HOME/pico-sdk"
      - name: Build
        env:
          PICO_SDK_PATH: ~/pico-sdk
        run: |
          export PICO_SDK_PATH="$HOME/pico-sdk"
          cmake -S . -B build
          cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: desk_pico.uf2
          path: build/desk_pico.uf2
